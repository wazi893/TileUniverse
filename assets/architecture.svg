<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099aa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0d0f11"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#eaeaea">
    TileUniverse Architecture
  </text>

  <!-- Layer 1: Python API -->
  <g transform="translate(50, 60)">
    <rect width="700" height="70" rx="8" fill="#1b1e22" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#shadow)"/>
    <text x="350" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#00e4ff">
      PYTHON API
    </text>
    <text x="350" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#888">
      tileuniverse.Engine • NumPy Integration • Config Loading
    </text>
  </g>

  <!-- Arrow 1 -->
  <path d="M400 135 L400 155" stroke="#00e4ff" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Layer 2: RL Integration -->
  <g transform="translate(50, 160)">
    <rect width="700" height="70" rx="8" fill="#1b1e22" stroke="#444" stroke-width="1" filter="url(#shadow)"/>
    <text x="350" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#eaeaea">
      RL INTEGRATION
    </text>
    <text x="350" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#888">
      TileUniverseSB3VecEnv • ParallelGridworld • Trajectory Recording
    </text>
  </g>

  <!-- Arrow 2 -->
  <path d="M400 235 L400 255" stroke="#00e4ff" stroke-width="2"/>

  <!-- Layer 3: Rust Core -->
  <g transform="translate(50, 260)">
    <rect width="700" height="70" rx="8" fill="#1b1e22" stroke="#444" stroke-width="1" filter="url(#shadow)"/>
    <text x="350" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#eaeaea">
      RUST CORE ENGINE
    </text>
    <text x="350" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#888">
      PyO3 Bindings • State Management • Reversible History • Ruleset Logic
    </text>
  </g>

  <!-- Arrow 3 -->
  <path d="M400 335 L400 355" stroke="#00e4ff" stroke-width="2"/>

  <!-- Layer 4: CUDA Kernels -->
  <g transform="translate(50, 360)">
    <rect width="700" height="70" rx="8" fill="#1b1e22" stroke="#444" stroke-width="1" filter="url(#shadow)"/>
    <text x="350" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#eaeaea">
      CUDA KERNELS
    </text>
    <text x="350" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#888">
      Depth-Batched Execution • L2 Cache Optimization • 40B evals/sec
    </text>
  </g>

  <!-- Arrow 4 -->
  <path d="M400 435 L400 450" stroke="#00e4ff" stroke-width="2"/>

  <!-- Layer 5: Parallel Worlds -->
  <g transform="translate(50, 455)">
    <rect x="0" y="0" width="100" height="35" rx="4" fill="url(#cyanGrad)"/>
    <text x="50" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#0d0f11">World₀</text>

    <rect x="120" y="0" width="100" height="35" rx="4" fill="url(#cyanGrad)"/>
    <text x="170" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#0d0f11">World₁</text>

    <rect x="240" y="0" width="100" height="35" rx="4" fill="url(#cyanGrad)"/>
    <text x="290" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#0d0f11">World₂</text>

    <rect x="360" y="0" width="100" height="35" rx="4" fill="#1b1e22" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <text x="410" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#888">...</text>

    <rect x="480" y="0" width="100" height="35" rx="4" fill="url(#cyanGrad)"/>
    <text x="530" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#0d0f11">Worldₙ</text>

    <rect x="600" y="0" width="100" height="35" rx="4" fill="#1b1e22" stroke="#444" stroke-width="1"/>
    <text x="650" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#666">100+ parallel</text>
  </g>

  <!-- Performance badge -->
  <g transform="translate(620, 70)">
    <rect width="120" height="50" rx="6" fill="#0d0f11" stroke="url(#cyanGrad)" stroke-width="1"/>
    <text x="60" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#00e4ff">40.5B</text>
    <text x="60" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#888">evals/sec</text>
  </g>
</svg>
