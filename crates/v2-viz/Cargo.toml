[package]
name = "v2-viz"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "v2-viz"
path = "src/main.rs"

[dependencies]
engine = { path = "../.." }
bevy = { version = "0.16", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "x11",
    "wayland",
    "default_font",
    "multi_threaded",
] }
bevy_egui = "0.35"
