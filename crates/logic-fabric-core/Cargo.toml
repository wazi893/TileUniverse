[package]
name = "logic-fabric-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies for quantum math
half = { version = "2.4", features = ["std"] }
itertools = "0.12"
regex = "1.10"
rand = "0.8"
once_cell = "1.21.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Optional CUDA support
[dependencies.cudarc]
version = "0.18"
optional = true
features = ["cuda-13000", "cublas", "cublaslt", "std", "f16"]

[features]
default = []
cuda = ["dep:cudarc"]
quantum_jit = []
