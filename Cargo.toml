[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
once_cell = "1"
rayon = "1.10"
rustc-hash = "2.0"
num-bigint = "0.4"
num-traits = "0.2"
macroquad = { version = "0.4", default-features = false, optional = true }
egui-macroquad = { version = "0.17", optional = true }
egui = { version = "0.28", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
serde_yaml = { version = "0.9", optional = true }
bincode = { version = "1.3", optional = true }
toml = { version = "0.8", optional = true }
image = { version = "0.25", optional = true }

[[bin]]
name = "logic-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "quantum-engine"
path = "src/bin/quantum_engine.rs"
required-features = ["cluster", "quantum_jit", "cranelift_jit"]

[features]
default = []
debug-signals = []
perf-bench = []
quantum_jit = []
# Enable serde support for distributed transport (EPIC 63 Phase 2b)
serde = ["dep:serde", "dep:bincode"]
# Enable cluster mode (EPIC 64)
cluster = ["serde", "dep:toml"]
# EPIC 76.4: Config file support (JSON/YAML scenarios)
config = ["serde", "dep:serde_json", "dep:serde_yaml"]
# Enable Cranelift JIT scaffolding and its deps
cranelift_jit = [
    "cranelift-codegen",
    "cranelift-module",
    "cranelift-frontend",
    "cranelift-object",
    "target-lexicon",
    "cranelift-jit",
]
# EPIC 66: Enable CUDA GPU backend
# EPIC 67: Also enables Tensor Core support with FP16
cuda = ["dep:cudarc", "logic-fabric-core/cuda"]
# EPIC 94: Enable raw CUDA FFI neural network (requires separate cuda_nn.cu compilation)
cuda_nn_ffi = ["cuda"]
# SPRINT 75: VQE FP8 Tensor Core acceleration (requires CUDA)
# Enables 10-26x speedup for VQE on 20-30 qubit circuits
vqe_fp8 = ["cuda"]
# EPIC 82: Integration of Burn and CubeCL
burn-compute = ["dep:burn", "dep:burn-cubecl", "dep:cubecl", "dep:cubecl-wgpu"]
# EPIC 78: True MWPM decoder using fusion-blossom
mwpm = ["dep:fusion-blossom"]
# EPIC 116: Visualization with macroquad
visualizer = ["dep:macroquad", "dep:egui-macroquad", "dep:egui"]
# TileAnneal Phase 3: CLI tools with image support
tileanneal-cli = ["dep:image"]
# EPIC 120: GPU Voxel Engine (Phase 1)
gpu-prototype = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:futures-intrusive"]
# EPIC 83 Verification: Deterministic proof-mode
proof-mode = ["perf-bench"]
# FPGA synthesis via RustHDL (Verilog generation)
fpga = ["dep:rust-hdl"]
# Enable slow-running tests (large qubit counts, heavy quantum simulations)
# Use: cargo test --features slow-tests
slow-tests = []
# Internal: Feature that's never enabled, used to exclude broken examples from build
__never_enabled = []

# FPGA synthesis: RustHDL compiles Rust subset → Verilog
[dependencies.rust-hdl]
version = "0.46"
optional = true

[dependencies.wgpu]
version = "0.20"
optional = true

[dependencies.pollster]
version = "0.3"
optional = true

[dependencies.bytemuck]
version = "1.16"
features = ["derive"]
optional = true

[dependencies.futures-intrusive]
version = "0.5"
optional = true

[dependencies.cranelift-object]
version = "0.104"
optional = true

[dependencies.cranelift-codegen]
version = "0.104"
optional = true

[dependencies.cranelift-module]
version = "0.104"
optional = true

[dependencies.cranelift-frontend]
version = "0.104"
optional = true

[dependencies.target-lexicon]
version = "0.12"
optional = true

[dependencies.cranelift-jit]
version = "0.104"
optional = true

# EPIC 66: CUDA GPU backend via cudarc (Rust-native bindings)
# Uses dynamic loading to avoid needing nvcc at build time.
# CUDA Toolkit must be installed and libraries available at runtime.
[dependencies.cudarc]
version = "0.18"
optional = true
# Use cuda-13000 for CUDA 13.x, dynamic-loading is default (no nvcc needed at build)
features = ["cuda-13000"]

[dependencies.logic-fabric-core]
path = "crates/logic-fabric-core"

# EPIC 67: FP16 (half-precision) support for Tensor Core operations
[dependencies.half]
version = "2.4"
features = ["std"]

[dependencies.burn]
version = "0.19.1"
optional = true
features = ["wgpu"]

[dependencies.burn-cubecl]
version = "0.19.1"
optional = true

[dependencies.cubecl]
version = "0.8.1"
optional = true

[dependencies.cubecl-wgpu]
version = "0.8.1"
optional = true

# EPIC 78: True MWPM decoder for QEC
[dependencies.fusion-blossom]
version = "0.2"
optional = true

[[bin]]
name = "bench_engine"
path = "src/bin/bench_engine.rs"

# EPIC 116: Tile visualizers (require macroquad)
[[example]]
name = "tile8_visualizer"
required-features = ["visualizer"]

[[example]]
name = "chungus2_visualizer"
required-features = ["visualizer"]

[[example]]
