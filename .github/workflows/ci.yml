name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Install nextest
      uses: taiki-e/install-action@nextest

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-v2-

    - name: Clean build artifacts
      run: cargo clean

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Build (release, no features)
      run: cargo build --release --verbose

    - name: Build (release, with perf-bench)
      run: cargo build --release --verbose --features perf-bench

    - name: Run tests (nextest)
      # nextest runs each test in its own process, so it parallelizes safely
      # without the resource-exhaustion SIGABRT that forced --test-threads=1.
      run: cargo nextest run --release --profile ci

    - name: Doctests
      # nextest does not run doctests; run them separately.
      run: cargo test --release --doc

    - name: Clippy
      run: cargo clippy -- -D warnings
      continue-on-error: true  # Don't fail CI on clippy warnings initially

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable

    - name: Install nextest
      uses: taiki-e/install-action@nextest

    - name: Clean build artifacts
      run: cargo clean

    - name: Build
      run: cargo build --release --verbose

    - name: Run tests (nextest)
      # Release mode avoids debug-mode heap corruption issues; nextest's
      # process-per-test isolation keeps parallel runs stable.
      run: cargo nextest run --release --profile ci

    - name: Doctests
      run: cargo test --release --doc
