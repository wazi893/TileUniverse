[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "tileuniverse"
version = "0.1.0"
description = "GPU-accelerated parallel universe simulator - 40B logic evals/sec on a single RTX 4070"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Games/Entertainment :: Simulation",
]
keywords = [
    "simulation",
    "gpu",
    "cuda",
    "reinforcement-learning",
    "cellular-automata",
    "parallel-worlds",
    "physics-engine",
]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
    "jupyter>=1.0",
]

[project.urls]
Homepage = "https://github.com/yourname/tileuniverse"
Documentation = "https://github.com/yourname/tileuniverse#readme"
Repository = "https://github.com/yourname/tileuniverse"

[project.scripts]
tileuniverse = "tileuniverse:_cli_main"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
module-name = "tileuniverse._core"
