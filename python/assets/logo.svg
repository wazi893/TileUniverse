<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="gridGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099aa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Grid Icon -->
  <g transform="translate(10, 15)">
    <!-- 4x4 grid of squares representing parallel worlds -->
    <rect x="0" y="0" width="15" height="15" fill="url(#gridGradient)" rx="2"/>
    <rect x="18" y="0" width="15" height="15" fill="url(#gridGradient)" rx="2"/>
    <rect x="36" y="0" width="15" height="15" fill="url(#gridGradient)" rx="2"/>
    <rect x="54" y="0" width="15" height="15" fill="#1b1e22" stroke="url(#gridGradient)" stroke-width="1.5" rx="2"/>

    <rect x="0" y="18" width="15" height="15" fill="url(#gridGradient)" rx="2"/>
    <rect x="18" y="18" width="15" height="15" fill="#1b1e22" stroke="url(#gridGradient)" stroke-width="1.5" rx="2"/>
    <rect x="36" y="18" width="15" height="15" fill="url(#gridGradient)" rx="2"/>
    <rect x="54" y="18" width="15" height="15" fill="url(#gridGradient)" rx="2"/>

    <rect x="0" y="36" width="15" height="15" fill="#1b1e22" stroke="url(#gridGradient)" stroke-width="1.5" rx="2"/>
    <rect x="18" y="36" width="15" height="15" fill="url(#gridGradient)" rx="2"/>
    <rect x="36" y="36" width="15" height="15" fill="url(#gridGradient)" rx="2"/>
    <rect x="54" y="36" width="15" height="15" fill="#1b1e22" stroke="url(#gridGradient)" stroke-width="1.5" rx="2"/>

    <rect x="0" y="54" width="15" height="15" fill="url(#gridGradient)" rx="2"/>
    <rect x="18" y="54" width="15" height="15" fill="url(#gridGradient)" rx="2"/>
    <rect x="36" y="54" width="15" height="15" fill="#1b1e22" stroke="url(#gridGradient)" stroke-width="1.5" rx="2"/>
    <rect x="54" y="54" width="15" height="15" fill="url(#gridGradient)" rx="2"/>
  </g>

  <!-- Wordmark -->
  <text x="95" y="62" font-family="Inter, SF Pro Display, -apple-system, system-ui, sans-serif" font-size="36" font-weight="600" fill="#eaeaea">
    Tile<tspan fill="url(#gridGradient)">Universe</tspan>
  </text>

  <!-- Tagline -->
  <text x="95" y="82" font-family="Inter, SF Pro Display, -apple-system, system-ui, sans-serif" font-size="11" font-weight="400" fill="#666" letter-spacing="0.5">
    PARALLEL UNIVERSE SIMULATION ENGINE
  </text>
</svg>
